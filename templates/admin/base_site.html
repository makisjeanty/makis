{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   Makis Digital - Unified Persistent Sidebar & Luxury Admin Navigation
   ========================================================================== */

:root {
    --font-primary: 'Inter', system-ui, -apple-system, sans-serif;
    --font-heading: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    
    --adm-sidebar-width: 260px;
    --adm-bg: #0F172A;
    --adm-surface: #1E293B;
    --adm-surface-hover: #334155;
    --adm-border: rgba(255, 255, 255, 0.08);
    --adm-accent: #38BDF8;
    --adm-accent-glow: rgba(56, 189, 248, 0.15);
    --adm-accent-hover: #0EA5E9;
    --adm-text-main: #F8FAFC;
    --adm-text-muted: #94A3B8;
    --adm-input-bg: #0F172A;
}

[data-theme="light"] {
    --adm-bg: #F8FAFC;
    --adm-surface: #FFFFFF;
    --adm-surface-hover: #F1F5F9;
    --adm-border: #E2E8F0;
    --adm-accent: #0284C7;
    --adm-accent-glow: rgba(2, 132, 199, 0.12);
    --adm-accent-hover: #0369A1;
    --adm-text-main: #0F172A;
    --adm-text-muted: #64748B;
    --adm-input-bg: #F8FAFC;
}

body {
    background-color: var(--adm-bg) !important;
    color: var(--adm-text-main) !important;
    font-family: var(--font-primary) !important;
    margin: 0;
    padding: 0;
}

/* Ocultar a nav-sidebar original do Django se existir */
#nav-sidebar { display: none !important; }

/* Estrutura Principal */
#container {
    display: flex !important;
    min-height: 100vh;
    width: 100%;
}

/* Header Superior Fixo */
#header {
    position: fixed;
    top: 0;
    left: var(--adm-sidebar-width);
    right: 0;
    height: 60px;
    z-index: 100;
    background: var(--adm-surface) !important;
    border-bottom: 1px solid var(--adm-border) !important;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px !important;
    box-sizing: border-box;
}

#site-name a {
    font-family: var(--font-heading) !important;
    font-size: 18px !important;
    font-weight: 700 !important;
    color: var(--adm-text-main) !important;
    text-decoration: none;
}

/* Sidebar Customizada Persistente */
#custom-admin-sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: var(--adm-sidebar-width);
    background: var(--adm-surface);
    border-right: 1px solid var(--adm-border);
    z-index: 110;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    box-sizing: border-box;
}

.sidebar-brand {
    padding: 18px 20px;
    border-bottom: 1px solid var(--adm-border);
    display: flex;
    align-items: center;
    gap: 12px;
}

.sidebar-brand-logo {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, var(--adm-accent) 0%, #0284C7 100%);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 800;
    font-size: 16px;
    font-family: var(--font-heading);
}

.sidebar-brand-title {
    font-family: var(--font-heading);
    font-size: 16px;
    font-weight: 700;
    color: var(--adm-text-main);
}

.sidebar-brand-subtitle {
    font-size: 11px;
    color: var(--adm-accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.sidebar-menu {
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.sidebar-group-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--adm-text-muted);
    padding: 0 10px 6px 10px;
}

.sidebar-nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.sidebar-nav-item a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    color: var(--adm-text-main);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    border-radius: 8px;
    transition: background 0.15s ease, color 0.15s ease;
}

.sidebar-nav-item a:hover, .sidebar-nav-item.active a {
    background: var(--adm-accent-glow);
    color: var(--adm-accent);
    font-weight: 600;
}

.sidebar-nav-icon {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}

/* Ajuste do Wrapper de Conteúdo Principal */
.main, #main, div.main {
    margin-left: var(--adm-sidebar-width) !important;
    margin-top: 60px !important;
    width: calc(100% - var(--adm-sidebar-width)) !important;
    box-sizing: border-box;
}

#content {
    padding: 24px !important;
}

div.breadcrumbs {
    margin: 0 0 20px 0 !important;
    background: var(--adm-surface) !important;
    border: 1px solid var(--adm-border) !important;
    border-radius: 8px;
}

@media (max-width: 768px) {
    #custom-admin-sidebar { display: none; }
    #header { left: 0; }
    .main, #main, div.main { margin-left: 0 !important; width: 100% !important; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Injetar Sidebar Persistente se não existir no DOM
    if (!document.getElementById('custom-admin-sidebar')) {
        const sidebarHTML = `
        <aside id="custom-admin-sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-logo">M</div>
                <div>
                    <div class="sidebar-brand-title">Makis OS</div>
                    <div class="sidebar-brand-subtitle">Painel de Gestão</div>
                </div>
            </div>
            
            <nav class="sidebar-menu">
                <div>
                    <div class="sidebar-group-title">Visão Geral</div>
                    <ul class="sidebar-nav-list">
                        <li class="sidebar-nav-item" data-path="/gestao-dmh8g6skcx/">
                            <a href="/gestao-dmh8g6skcx/"><span class="sidebar-nav-icon">📊</span> Dashboard</a>
                        </li>
                    </ul>
                </div>

                <div>
                    <div class="sidebar-group-title">Conteúdo & Blog</div>
                    <ul class="sidebar-nav-list">
                        <li class="sidebar-nav-item" data-path="/blog/post/">
                            <a href="/gestao-dmh8g6skcx/blog/post/"><span class="sidebar-nav-icon">📝</span> Artigos / Posts</a>
                        </li>
                        <li class="sidebar-nav-item" data-path="/blog/categoria/">
                            <a href="/gestao-dmh8g6skcx/blog/categoria/"><span class="sidebar-nav-icon">🏷️</span> Categorias</a>
                        </li>
                        <li class="sidebar-nav-item" data-path="/blog/comentario/">
                            <a href="/gestao-dmh8g6skcx/blog/comentario/"><span class="sidebar-nav-icon">💬</span> Comentários</a>
                        </li>
                    </ul>
                </div>

                <div>
                    <div class="sidebar-group-title">Portfólio & Projetos</div>
                    <ul class="sidebar-nav-list">
                        <li class="sidebar-nav-item" data-path="/portfolio/projeto/">
                            <a href="/gestao-dmh8g6skcx/portfolio/projeto/"><span class="sidebar-nav-icon">💼</span> Projetos</a>
                        </li>
                        <li class="sidebar-nav-item" data-path="/portfolio/imagemprojeto/">
                            <a href="/gestao-dmh8g6skcx/portfolio/imagemprojeto/"><span class="sidebar-nav-icon">🖼️</span> Galeria de Fotos</a>
                        </li>
                    </ul>
                </div>

                <div>
                    <div class="sidebar-group-title">Comunidade & Interação</div>
                    <ul class="sidebar-nav-list">
                        <li class="sidebar-nav-item" data-path="/comunidade/topico/">
                            <a href="/gestao-dmh8g6skcx/comunidade/topico/"><span class="sidebar-nav-icon">🌐</span> Tópicos Fórum</a>
                        </li>
                        <li class="sidebar-nav-item" data-path="/comunidade/resposta/">
                            <a href="/gestao-dmh8g6skcx/comunidade/resposta/"><span class="sidebar-nav-icon">↩️</span> Respostas</a>
                        </li>
                        <li class="sidebar-nav-item" data-path="/chat/mensagem/">
                            <a href="/gestao-dmh8g6skcx/chat/mensagem/"><span class="sidebar-nav-icon">⚡</span> Mensagens Chat</a>
                        </li>
                    </ul>
                </div>

                <div>
                    <div class="sidebar-group-title">Usuários & Habilidades</div>
                    <ul class="sidebar-nav-list">
                        <li class="sidebar-nav-item" data-path="/accounts/perfilusuario/">
                            <a href="/gestao-dmh8g6skcx/accounts/perfilusuario/"><span class="sidebar-nav-icon">👤</span> Perfis de Usuários</a>
                        </li>
                        <li class="sidebar-nav-item" data-path="/accounts/habilidade/">
                            <a href="/gestao-dmh8g6skcx/accounts/habilidade/"><span class="sidebar-nav-icon">🛠️</span> Habilidades (Skills)</a>
                        </li>
                        <li class="sidebar-nav-item" data-path="/core/compra/">
                            <a href="/gestao-dmh8g6skcx/core/compra/"><span class="sidebar-nav-icon">🛒</span> Vendas & Pedidos</a>
                        </li>
                    </ul>
                </div>

                <div>
                    <div class="sidebar-group-title">Atalhos Externos</div>
                    <ul class="sidebar-nav-list">
                        <li class="sidebar-nav-item">
                            <a href="/" target="_blank"><span class="sidebar-nav-icon">🚀</span> Ver Site Público</a>
                        </li>
                        <li class="sidebar-nav-item">
                            <a href="/solicitar-orcamento/" target="_blank"><span class="sidebar-nav-icon">💰</span> Orçamentos</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </aside>
        `;
        document.body.insertAdjacentHTML('afterbegin', sidebarHTML);

        // Destacar o item ativo com base na URL atual
        const currentPath = window.location.pathname;
        document.querySelectorAll('.sidebar-nav-item').forEach(item => {
            const targetPath = item.getAttribute('data-path');
            if (targetPath && currentPath.includes(targetPath)) {
                item.classList.add('active');
            } else if (targetPath === '/gestao-dmh8g6skcx/' && (currentPath === '/gestao-dmh8g6skcx/' || currentPath === '/gestao-dmh8g6skcx')) {
                item.classList.add('active');
            }
        });
    }
});
</script>
{% endblock %}
