version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: makis_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:-base_central}
      MYSQL_USER: ${DB_USER:-user_central}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${DB_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0-alpine
    container_name: makis_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: makis_web
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    environment:
      - SECRET_KEY=${SECRET_KEY:?defina SECRET_KEY no .env}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?defina ALLOWED_HOSTS no .env (nunca use * em produção)}
      - DB_NAME=${DB_NAME:-base_central}
      - DB_USER=${DB_USER:-user_central}
      - DB_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD no .env}
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_URL=${ADMIN_URL:-gestao-dmh8g6skcx}
      - MONITORIA_URL=${MONITORIA_URL:-monitoria}
      - KIWIFY_TOKEN=${KIWIFY_TOKEN:?defina KIWIFY_TOKEN no .env}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.example.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-contato@makisdigital.com}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:?defina EMAIL_HOST_PASSWORD no .env}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: makis_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  mysql_data:
  media_data:
  static_data:
